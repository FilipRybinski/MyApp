<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Password Changed Successfully</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #f2f4f8;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #333;
        }

        .container {
            max-width: 600px;
            margin: 50px auto;
            background-color: #ffffff;
            border-radius: 10px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
            padding: 40px;
        }

        .header {
            text-align: center;
            padding-bottom: 20px;
            border-bottom: 1px solid #eaeaea;
        }

        .header h1 {
            color: #2ecc71;
            margin: 0;
            font-size: 24px;
        }

        .content {
            padding: 30px 0;
            text-align: center;
        }

        .content p {
            font-size: 16px;
            line-height: 1.6;
            margin: 12px 0;
        }

        .footer {
            margin-top: 30px;
            text-align: center;
            font-size: 13px;
            color: #888;
        }

        @media (max-width: 600px) {
            .container {
                padding: 20px;
            }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>🔒 Password Changed</h1>
    </div>
    <div class="content">
        <p>Your password has been successfully updated.</p>
        <p>If you made this change, no further action is needed.</p>
        <p>If you did <strong>not</strong> change your password, please contact our support team immediately.</p>
    </div>
    <div class="footer">
        &copy; 2025 MyAppZone. All rights reserved.
    </div>
</div>
</body>
</html>
